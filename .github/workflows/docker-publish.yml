name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/plumb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # PRs get a build-only check (no push) so forks/branches can validate
      # the Dockerfile without needing registry credentials.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in k8s manifests
        if: github.event_name != 'pull_request'
        run: |
          # Must match the tag docker/metadata-action actually publishes
          # (type=sha,format=short,prefix= -> bare short SHA, e.g. "eaff408").
          NEW_TAG=$(git rev-parse --short HEAD)
          sed -i "s#^    newTag: .*#    newTag: ${NEW_TAG}#" k8s/kustomization.yaml
          sed -i "s#image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*#image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${NEW_TAG}#" k8s/deployment.yaml
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

      - name: Commit updated manifests
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- k8s/kustomization.yaml k8s/deployment.yaml; then
            git add k8s/kustomization.yaml k8s/deployment.yaml
            git commit -m "chore: bump image to ${NEW_TAG} [skip ci]"
            git push
          else
            echo "No manifest changes to commit"
          fi
