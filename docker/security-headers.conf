# nginx replaces inherited add_header directives as soon as a location declares its
# own, so this snippet is included in every location rather than set once at server level.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# The editor needs inline styles (Monaco injects them) and a same-origin worker.
# Everything else stays closed: no third-party scripts, no framing, no form posts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
